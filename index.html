  <style>
    :root {
      color-scheme: dark;
      --bg: #0a1016;
      --panel: #101a22;
      --panel-2: #13202a;
      --muted: #9fb3c8;
      --text: #ecf5ff;
      --primary: #6ee7ff;
      --primary-2: #8b5cf6;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: "Figtree", sans-serif; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(110, 231, 255, 0.12), transparent 18%),
        radial-gradient(circle at top right, rgba(139, 92, 246, 0.12), transparent 24%),
        linear-gradient(180deg, #0a1016 0%, #0d141d 100%);
    }
    #root {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .shell {
      width: min(1120px, 100%);
      background: rgba(12, 19, 26, 0.9);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: clamp(20px, 4vw, 48px);
      backdrop-filter: blur(12px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(110, 231, 255, 0.08);
      color: var(--primary);
      border: 1px solid rgba(110, 231, 255, 0.2);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
    }
    h1 {
      margin: 18px 0 12px;
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: clamp(2.7rem, 6vw, 5rem);
      line-height: 0.96;
      letter-spacing: -0.06em;
    }
    .accent {
      background: linear-gradient(135deg, var(--primary), #a78bfa 55%, #f9a8d4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle {
      max-width: 700px;
      font-size: clamp(1.04rem, 2vw, 1.28rem);
      line-height: 1.7;
      color: var(--muted);
      margin: 0;
    }
    .cta-row {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }
    .button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 14px 22px;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, opacity 0.2s ease;
      cursor: pointer;
    }
    .button:hover { transform: translateY(-1px); }
    .button.primary {
      background: linear-gradient(135deg, var(--primary) 0%, #74d9ff 100%);
      color: #08131b;
      box-shadow: 0 12px 28px rgba(110, 231, 255, 0.35);
    }
    .button.secondary {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .stats {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 12px;
    }
    .stat {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 16px;
    }
    .stat strong {
      display: block;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-family: "JetBrains Mono", monospace;
      margin-bottom: 6px;
    }
    .stat span {
      color: var(--muted);
      font-size: 0.88rem;
    }
    @media (max-width: 640px) {
      #root { padding: 18px; }
      .shell { padding: 20px; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>

    <div id="root"></div>

  </body>
